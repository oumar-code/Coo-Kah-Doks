site_name: "[FACTORY_NAME]"
site_description: >
  [FACTORY_TIER] — Blueprint, operational docs & AI-integration specs for the
  [FACTORY_NAME] ([FACTORY_LOCATION], Nigeria).
  [FACTORY_ONE_LINE_DESCRIPTION].
  Part of the Coo-Cah Technologies Manufacturing Ecosystem.
site_url: https://oumar-code.github.io/[REPO_NAME]/
repo_url: https://github.com/oumar-code/[REPO_NAME]
repo_name: oumar-code/[REPO_NAME]
edit_uri: edit/main/docs/

# ---------------------------------------------------------------------------
# Replace [PRIMARY_COLOUR] and [ACCENT_COLOUR] with a Material colour token.
# Colour guide (use one per factory vertical to distinguish sites):
#   Tier 1 Critical Infrastructure  → red / orange
#   Electronics — Power             → indigo / indigo
#   Electronics — Personal          → deep-purple / purple
#   Electronics — Kitchen           → teal / cyan
#   Chemicals — Plastics            → green / light-green
#   Chemicals — Metallurgical       → blue-grey / cyan
# ---------------------------------------------------------------------------
theme:
  name: material
  palette:
    - scheme: default
      primary: "[PRIMARY_COLOUR]"
      accent: "[ACCENT_COLOUR]"
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: "[PRIMARY_COLOUR]"
      accent: "[ACCENT_COLOUR]"
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Master Repo Reference: master-repo-ref.md
  - Factory Docs:
    - Machinery & Equipment: machinery.md
    - Energy Profile: energy-profile.md
    - Floor Plan: floor-plan.md
    - Automation Roadmap: automation-roadmap.md
    - Supply Chain: supply-chain.md
    - Regulatory & Compliance: regulatory.md
    - CapEx / OpEx: capex-opex.md
    - Digital Twin: digital-twin.md
    - MES Integration: mes-integration.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/oumar-code/Coo-Kah-Doks
      name: Master Repository — Coo-Kah-Doks

extra_css:
  - stylesheets/extra.css

copyright: >
  © 2025 Coo-Cah Technologies Holdings. All rights reserved. |
  Part of the Coo-Cah Manufacturing Ecosystem.
