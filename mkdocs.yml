site_name: Coo-Kah-Doks — Project Coo-Cah Blueprint
site_description: Master orchestrating repository and blueprint documentation for Coo-Cah Technologies Holdings
site_author: Coo-Cah Technologies Holdings
site_url: https://oumar-code.github.io/Coo-Kah-Doks/
repo_url: https://github.com/oumar-code/Coo-Kah-Doks
repo_name: oumar-code/Coo-Kah-Doks
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: deep-orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep-orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.png
  favicon: assets/favicon.ico
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true

nav:
  - Home: index.md
  - Vision & Strategy:
    - Overview: 00-vision/index.md
    - Corporate Structure: 01-corporate-structure/index.md
    - Energy Strategy: 02-energy-strategy/index.md
    - Energy Infrastructure:
      - Solar Power Bank: energy/solar-power-bank/README.md
      - Wind Power Bank: energy/wind-power-bank/README.md
      - Hybrid Systems: energy/hybrid-systems/README.md
    - Finance: 10-finance/index.md
  - Factory Blueprints:
    - All Factories: 03-factories/index.md
    - Electronics Vertical:
      - Personal Electronics: factories/electronics/personal-electronics/README.md
      - Kitchen Electronics: factories/electronics/kitchen-electronics/README.md
      - Garage & Power Electronics: factories/electronics/garage-power-electronics/README.md
      - Smart Home & Office: factories/electronics/smart-home-office/README.md
      - Security Electronics: factories/electronics/security-electronics/README.md
      - Smart Estate & City: factories/electronics/smart-estate-city/README.md
    - Chemicals Vertical:
      - Heavy Chemicals: factories/chemicals/heavy-chemicals/README.md
      - Fine Chemicals: factories/chemicals/fine-chemicals/README.md
      - Fertilizer: factories/chemicals/fertilizer/README.md
      - Plastics & Polymers: factories/chemicals/plastics/README.md
      - Metallurgical & Minerals: factories/chemicals/metallurgical/README.md
    - Consumer Goods Vertical:
      - Food & Beverages: factories/consumer-goods/food-beverages/README.md
      - Personal Care: factories/consumer-goods/personal-care/README.md
      - Household Cleaning: factories/consumer-goods/household-cleaning/README.md
      - Packaged Water: factories/consumer-goods/packaged-water/README.md
      - Baby & Infant Products: factories/consumer-goods/baby-products/README.md
    - Lifestyle Vertical:
      - Fashion & Apparel: factories/lifestyle/fashion-apparel/README.md
      - Furniture & Home Décor: factories/lifestyle/furniture-decor/README.md
    - Template: factories/_template/README.md
  - Technology:
    - Semiconductor (Baobab): 04-semiconductor/index.md
    - Smart Factory Core: 05-smart-factory-core/index.md
    - Automation Phases: 06-automation-phases/index.md
    - AI Platform: 08-ai-platform/index.md
    - Supply Chain: 07-supply-chain/index.md
  - Compliance:
    - Regulatory Overview: 09-compliance-regulatory/index.md
    - Factory Status Registry: orchestration/factory-status-registry.md
    - Gate 1 Readiness Program: orchestration/gate-1-readiness.md
    - Cross-Repo Workflows: orchestration/cross-repo-workflows.md
  - Architecture Decisions:
    - ADR Index: adrs/README.md
    - ADR-001 Energy Source: adrs/ADR-001-energy-source-selection.md
    - ADR-002 MES Platform: adrs/ADR-002-mes-platform-selection.md
    - ADR-003 Digital Twin Platform: adrs/ADR-003-digital-twin-platform.md
    - ADR-004 AMR Fleet Platform: adrs/ADR-004-amr-fleet-platform.md
    - ADR-005 ERP Platform: adrs/ADR-005-erp-platform.md
    - ADR-006 AI Platform Architecture: adrs/ADR-006-ai-platform-architecture.md
  - Reference:
    - Glossary: glossary.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/oumar-code/Coo-Kah-Doks
  generator: false

